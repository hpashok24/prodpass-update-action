# Example: copy into the repository you deploy from, as .github/workflows/prodpass-release.yml
# Each pushed version tag (e.g. v1.4.2) is recorded as the instance's version in ProdPass.
name: Update ProdPass version on release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: hpashok24/prodpass-update-action@main
        with:
          prodpass_url: ${{ vars.PRODPASS_URL || secrets.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: order-service.uat2
          version: ${{ github.ref_name }}
