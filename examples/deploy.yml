# Example: copy into the repository you deploy from, as .github/workflows/deploy.yml
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: ./deploy.sh uat2          # replace with your deployment

      - name: Report deployment to ProdPass
        if: always()                   # report failures too
        uses: hpashok24/prodpass-update-action@v1
        with:
          prodpass_url: ${{ vars.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: payment-hub.uat2
          version: ${{ github.ref_name }}
          status: ${{ job.status }}
