name: Test release REL-00002 (Nextgen)

on:
  workflow_dispatch:

permissions: {}

jobs:
  # 1. PERF1: the instance you picked
  deploy-perf1:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to PERF1
        run: echo "Deploying Nextgen 2.0.0 to PERF1"

      - name: Record PERF1 deployment
        if: always()
        uses: prodpass/deploy-action@main
        with:
          prodpass_url: ${{ secrets.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: Nextgen.perf1
          version: "2.0.0"
          release: REL-00002
          project: KYC-UPG
          status: ${{ job.status }}

  # 2. Pre-prod: turns the "Deployed to pre-prod" gate green
  deploy-preprod:
    needs: deploy-perf1
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to pre-prod
        run: echo "Deploying Nextgen 2.0.0 to pre-prod"

      - name: Record pre-prod deployment
        if: always()
        uses: prodpass/deploy-action@main
        with:
          prodpass_url: ${{ secrets.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: Nextgen.preprod
          version: "2.0.0"
          release: REL-00002
          project: KYC-UPG
          status: ${{ job.status }}
