name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      instance:
        description: "Instance code to record a test deployment on (end-to-end against PRODPASS_URL)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/index.test.js

  # Manual only: records a real deployment in ProdPass, using this branch's code (./)
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.instance != ''
    needs: unit
    runs-on: ubuntu-latest
    environment: dev
    env:
      # The URL isn't secret, so a variable is preferred, but a secret of the same name works too
      PRODPASS_URL: ${{ vars.PRODPASS_URL || secrets.PRODPASS_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the dev environment settings
        env:
          HAS_TOKEN: ${{ secrets.PRODPASS_TOKEN != '' }}
        run: |
          missing=0
          if [ -z "$PRODPASS_URL" ]; then
            echo "::error::PRODPASS_URL is not set in the 'dev' environment: add it under Settings > Environments > dev > Environment variables"
            missing=1
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::PRODPASS_TOKEN is not set in the 'dev' environment: add it under Settings > Environments > dev > Environment secrets"
            missing=1
          fi
          exit $missing

      - name: Record a test deployment
        id: deploy
        uses: ./
        with:
          prodpass_url: ${{ env.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: ${{ inputs.instance }}
          version: e2e-${{ github.run_id }}

      - name: Send the same event again (must be ignored)
        uses: ./
        with:
          prodpass_url: ${{ env.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: ${{ inputs.instance }}
          version: e2e-${{ github.run_id }}
          event_id: ${{ steps.deploy.outputs.event_id }}

      - name: Unknown instance must fail the step
        id: unmatched
        continue-on-error: true
        uses: ./
        with:
          prodpass_url: ${{ env.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: e2e-no-such-instance-${{ github.run_id }}
          version: "0.0.0"

      - name: Check results
        env:
          OUTCOME: ${{ steps.deploy.outputs.outcome }}
          UNMATCHED: ${{ steps.unmatched.outcome }}
        run: |
          echo "deploy outcome: $OUTCOME, unknown instance step: $UNMATCHED"
          [ "$OUTCOME" = "applied" ] && [ "$UNMATCHED" = "failure" ]
