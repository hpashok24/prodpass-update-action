name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      instance:
        description: "Instance code to record a test deployment on (end-to-end against PRODPASS_URL)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  # Manual only: records a real deployment in ProdPass, using this branch's code (./)
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.instance != ''
    needs: unit
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Record a test deployment
        id: deploy
        uses: ./
        with:
          prodpass_url: ${{ vars.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: ${{ inputs.instance }}
          version: e2e-${{ github.run_id }}

      - name: Send the same event again (must be ignored)
        uses: ./
        with:
          prodpass_url: ${{ vars.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: ${{ inputs.instance }}
          version: e2e-${{ github.run_id }}
          event_id: ${{ steps.deploy.outputs.event_id }}

      - name: Unknown instance must fail the step
        id: unmatched
        continue-on-error: true
        uses: ./
        with:
          prodpass_url: ${{ vars.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: e2e-no-such-instance-${{ github.run_id }}
          version: "0.0.0"

      - name: Check results
        env:
          OUTCOME: ${{ steps.deploy.outputs.outcome }}
          UNMATCHED: ${{ steps.unmatched.outcome }}
        run: |
          echo "deploy outcome: $OUTCOME, unknown instance step: $UNMATCHED"
          [ "$OUTCOME" = "applied" ] && [ "$UNMATCHED" = "failure" ]
