name: Update ProdPass version

on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: hpashok24/prodpass-update-action@main
        with:
          prodpass_url: ${{ vars.PRODPASS_URL || secrets.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: order-service.uat2
          version: "1.5.0"
