name: Update ProdPass version

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Instance code, e.g. order-service.uat2"
        required: true
      version:
        description: "Version, e.g. 1.4.2"
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          prodpass_url: ${{ vars.PRODPASS_URL || secrets.PRODPASS_URL }}
          prodpass_token: ${{ secrets.PRODPASS_TOKEN }}
          instance: ${{ inputs.instance }}
          version: ${{ inputs.version }}
